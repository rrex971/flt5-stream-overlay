<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLT5 Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="overlay">
        <video class="background-art" src="../assets/background.webm" autoplay loop muted playsinline></video>
        <header class="brand-row">
            <div class="logo-crop"><img src="../assets/flt5-logo.png" alt="FLT5"></div>
            <h1 class="sticker-title"><span>MATCH</span><span>SCHEDULE</span></h1>
            <div class="top-loops" aria-hidden="true">
                <img src="../assets/loops/blue.png" alt="">
                <img src="../assets/loops/pink.png" alt="">
                <img src="../assets/loops/yellow.png" alt="">
                <img src="../assets/loops/purple.png" alt="">
                <img src="../assets/loops/orange.png" alt="">
            </div>
            <div class="round-sticker"><span id="stage-name">FINALS</span></div>
        </header>
        <section class="schedule-shell">
            <div class="match-grid" id="match-grid"></div>
            <div class="empty-state" id="empty-state">
                <strong>SCHEDULE PENDING</strong>
                <span>—</span>
            </div>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
