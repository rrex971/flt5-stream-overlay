<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLT5 Intermission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="overlay">
        <video id="background" class="background-art" autoplay loop muted playsinline></video>
        <section class="technical-copy" hidden>
            <div class="technical-brand"><div class="logo-crop"><img src="../assets/flt5-logo.png" alt="FLT5"></div><span>BACK IN A MOMENT</span></div>
            <h1>TECHNICAL DIFFICULTIES...</h1>
            <p>Thanks for your patience ~!</p>
        </section>
        <section class="timer-card" id="timer-card" hidden>
            <div class="panel-sticker timer-label" id="timer-label">STARTING IN</div>
            <time id="countdown">00:00</time>
        </section>
        <aside class="chat-card panel">
            <div class="panel-sticker twitch-label">TWITCH CHAT</div>
            <div class="chat-feed"><div id="twitch-chat" class="chat-messages"></div></div>
        </aside>
        <aside class="casters-card panel">
            <div class="panel-sticker">CASTERS</div>
        </aside>
    </main>
    <script src="../deps/twitch-chat.js"></script>
    <script src="../deps/reconnecting-websocket.min.js"></script>
    <script src="../deps/now-playing.js"></script>
    <script src="index.js"></script>
</body>
</html>
